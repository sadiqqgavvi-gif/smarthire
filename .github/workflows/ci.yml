name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            smarthire-server/package-lock.json
            SmartHire/package-lock.json

      - name: Install backend dependencies
        working-directory: smarthire-server
        run: npm ci

      - name: Run backend tests
        working-directory: smarthire-server
        run: npm test

      - name: Install frontend dependencies
        working-directory: SmartHire
        run: npm ci

      - name: Run frontend tests
        working-directory: SmartHire
        run: npm test
