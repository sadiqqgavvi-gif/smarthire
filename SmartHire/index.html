<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SmartHire – AI Interview Practice with Instant Feedback</title>
    <meta
      name="description"
      content="Practice technical, behavioral and situational interview questions, answer by voice or text, and get instant AI feedback on relevance, structure and clarity. 30,000+ questions, free to start."
    />
    <link rel="canonical" href="https://smarrthire.netlify.app/" />

    <link rel="icon" type="image/svg+xml" href="/smarthire-logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />

    <!-- Link previews (WhatsApp, LinkedIn, X, Slack...) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SmartHire" />
    <meta property="og:title" content="SmartHire – AI Interview Practice" />
    <meta
      property="og:description"
      content="Answer real interview questions by voice or text and get instant feedback on what to improve."
    />
    <meta property="og:url" content="https://smarrthire.netlify.app/" />
    <meta property="og:image" content="https://smarrthire.netlify.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SmartHire – AI Interview Practice" />
    <meta
      name="twitter:description"
      content="Answer real interview questions by voice or text and get instant feedback on what to improve."
    />
    <meta name="twitter:image" content="https://smarrthire.netlify.app/og-image.png" />
    <script>
      // Apply the saved theme before React loads to avoid a flash of the wrong theme.
      (function () {
        try {
          var saved = localStorage.getItem("smarthire-theme");
          var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>SmartHire needs JavaScript enabled to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
