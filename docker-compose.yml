services:
  mongodb:
    image: mongo:7
    container_name: smarthire-mongodb
    restart: unless-stopped
    init: true
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./smarthire-server
      dockerfile: Dockerfile
    container_name: smarthire-backend
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/smarthire
      JWT_SECRET: change_me_jwt_secret
      ACCESS_TOKEN_SECRET: change_me_access_secret
      REFRESH_TOKEN_SECRET: change_me_refresh_secret
      CLIENT_ORIGINS: http://localhost:5173
      OPENAI_API_KEY: ${OPENAI_API_KEY:-your_key_here}
      OPENAI_EVALUATION_MODEL: ${OPENAI_EVALUATION_MODEL:-gpt-4o-mini}
      USE_AI: ${USE_AI:-false}
      USE_PYTHON_EVALUATOR: ${USE_PYTHON_EVALUATOR:-true}
      PYTHON_BIN: python3
      PYTHON_EVALUATOR_TIMEOUT_MS: 12000
      LOG_HTTP_REQUESTS: true
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 250
      AUTH_RATE_LIMIT_MAX: 40
      AI_RATE_LIMIT_MAX: 20
      MOCK_EVAL_RATE_LIMIT_MAX: 25
      MONGO_CONNECT_TIMEOUT_MS: 10000
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./SmartHire
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000
    container_name: smarthire-frontend
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "5173:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
